[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runbook-pilot"
version = "0.1.0"
description = "Plan a runbook, wait for approval, and run only allow-listed commands."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Rohit Bhatt", email = "rohit.bhatt.dev@gmail.com" }]
keywords = ["runbook", "cli", "ops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Operating System :: POSIX",
]
dependencies = [
    "typer>=0.12",
    "openai>=1.40",
    "PyYAML>=6",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
runbook-pilot = "runbook_pilot.cli:app"
pilot = "runbook_pilot.cli:app"

[project.urls]
Homepage = "https://github.com/rbhatt1999/runbook-pilot"
Repository = "https://github.com/rbhatt1999/runbook-pilot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
